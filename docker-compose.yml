services:
  backend:
    build: ./backend
    ports:
      - 8000:8000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: >
      python manage.py runserver 0.0.0.0:8000
  db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: habit-tracker
    ports:
      - 5433:5432
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:
